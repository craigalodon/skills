default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.70
    hooks:
      - id: rumdl

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-skills
        name: validate skills
        entry: uv run scripts/validate_skills.py
        language: system
        pass_filenames: false
        files: '(^|/)(SKILL\.md|README\.md)$|^scripts/validate_skills\.py$|^\.claude-plugin/marketplace\.json$'

      - id: validator-tests
        name: validator and packager tests
        entry: uv run --with pytest --with pyyaml>=6 pytest -q
        language: system
        pass_filenames: false
        files: '^(scripts/(validate_skills|package_skills)\.py|tests/)'
