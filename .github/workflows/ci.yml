name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # No pyproject.toml/uv.lock in this repo (PEP 723 inline-metadata
          # scripts instead) -- point at those so the cache actually keys
          # off real dependency changes instead of never invalidating.
          cache-dependency-glob: "**/*.py"
          # Without this, `checks` and `validate` hash the same glob to the
          # same key and race to save it, so one job's save always fails
          # with "another job may be creating this cache".
          cache-suffix: checks

      - name: Check repository files
        shell: bash
        run: |
          git ls-files -z | xargs -0 uvx --from pre-commit-hooks==6.0.0 check-added-large-files
          git ls-files -z | xargs -0 uvx --from pre-commit-hooks==6.0.0 check-merge-conflict
          git ls-files -z '*.toml' | xargs -0 --no-run-if-empty uvx --from pre-commit-hooks==6.0.0 check-toml
          git ls-files -z '*.yaml' '*.yml' | xargs -0 --no-run-if-empty uvx --from pre-commit-hooks==6.0.0 check-yaml
          git ls-files -z '*.json' | xargs -0 --no-run-if-empty uvx --from pre-commit-hooks==6.0.0 check-json
          git ls-files -z | xargs -0 uvx --from pre-commit-hooks==6.0.0 end-of-file-fixer
          git ls-files -z | xargs -0 uvx --from pre-commit-hooks==6.0.0 trailing-whitespace-fixer
          git diff --exit-code

      - name: Check Markdown
        run: uvx --from rumdl==0.2.70 rumdl check .

      - name: Lint helper scripts
        run: |
          uvx ruff@0.16.6 check scripts/ tests/
          uvx ruff@0.16.6 format --check scripts/ tests/

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # No pyproject.toml/uv.lock in this repo (PEP 723 inline-metadata
          # scripts instead) -- point at those so the cache actually keys
          # off real dependency changes instead of never invalidating.
          cache-dependency-glob: "**/*.py"
          # See the `checks` job for why this needs to differ per job.
          cache-suffix: validate

      - name: Validate SKILL.md portability and conventions
        run: uv run scripts/validate_skills.py

      - name: Test the validator
        run: uv run --with pytest --with 'pyyaml>=6' pytest -q
